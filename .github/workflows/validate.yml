name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: pip install pyyaml jsonschema
      - name: Validate repository
        run: python scripts/validate.py

  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagram dependencies
        run: pip install cairosvg
      - name: Rebuild diagrams
        run: python scripts/build_diagrams.py
      - name: Check that SVG regeneration is deterministic
        run: |
          git diff --exit-code -- \
            diagrams/architecture.svg \
            diagrams/fast-verification.svg \
            diagrams/mcu-mapping.svg \
            diagrams/pdk-fastpath.svg
