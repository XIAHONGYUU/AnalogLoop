# Synthetic example specification for a two-stage op-amp.
# This is an illustrative target, not a validated design.

name: two-stage-opamp-v1
topology: two-stage-opamp-v1
pdk: sky130A
description: >-
  Fixed topology, pre-layout sizing. The first benchmark target for the
  AnalogLoop protocol.

supply:
  vdd_v: 1.8
  vss_v: 0.0
  tolerance_pct: 10

load:
  capacitance_pf: 1.0
  resistance_kohm: 10

metrics:
  gain_db:
    min: 60
    weight: 1.0
  ugb_mhz:
    min: 100
    weight: 1.0
  pm_deg:
    min: 60
    weight: 1.5
  power_mw:
    max: 5.0
    weight: 1.0
  noise_uvrms:
    max: 30
    weight: 0.5
  offset_mv:
    max: 5
    weight: 0.5
  area_mm2:
    max: 0.02
    weight: 1.0
    guardband_pct: 10

variables:
  - {name: w1_um, min: 5, max: 50, step: 1}
  - {name: l1_um, min: 0.15, max: 2.0, step: 0.05}
  - {name: w5_um, min: 10, max: 100, step: 2}
  - {name: l5_um, min: 0.15, max: 2.0, step: 0.05}
  - {name: w7_um, min: 10, max: 100, step: 2}
  - {name: l7_um, min: 0.15, max: 2.0, step: 0.05}
  - {name: cc_pf, min: 0.2, max: 5.0, step: 0.1}
  - {name: ibias_ua, min: 5, max: 100, step: 5}

corners:
  - {process: tt, temperature_c: 27, supply_v: 1.8}
  - {process: ss, temperature_c: 125, supply_v: 1.62}
  - {process: ff, temperature_c: -40, supply_v: 1.98}

execution:
  adapter: asst
  simulators: [spectre, alps, xa]
  config: config.csv
  summary: summary.xlsx
  public_demo_simulator: ngspice
  note: "ASST is the author's prior workflow; not bundled in this repo."

area:
  budget_mm2: 0.02
  guardband_pct: 10
  rule_pack: generic-180
  note: "Educational rule pack, not a PDK. Calibrate before signoff."

budget:
  fast_calls: 2000
  spice_calls: 50
  max_iter: 80
  margin_target:
    gain_db: 1.0
    ugb_mhz: 5.0
    pm_deg: 5.0
    power_mw: 0.2

promotion_gate:
  sigma_k: 3.0
  ood_threshold: 0.15
  critical_metrics: [pm_deg]
  spice_reserve: 10

measurement_contract:
  version: "0.1.0"
  note: >-
    Gain at low frequency, UGB at unity loop gain, PM at the crossover with
    the specified load. Definitions must not change without a version bump.

notes: >-
  This example exists to make the schema concrete. It is not a claim that the
  specifications are achievable on Sky130, nor a validated netlist.