ans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="12.8" font-weight="400" fill="#5b6778" text-anchor="start" opacity="1.0">Cache 有一致性协议；代理会误接受 → 需要晋级门与置信度</text><text x="820" y="822" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="12.8" font-weight="400" fill="#5b6778" text-anchor="start" opacity="1.0">MCU 不学习；本架构会积累</text><text x="820" y="844" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="12.8" font-weight="400" fill="#5b6778" text-anchor="start" opacity="1.0">→ 记忆是额外一层，不是 CPU 的一部分</text><line x1="50" y1="866" x2="1550" y2="866" stroke="#dde3ea" stroke-width="1"/><text x="50" y="886" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="12.5" font-weight="400" fill="#8a94a6" text-anchor="start" opacity="1.0">AnalogLoop · architecture note</text><text x="1550" y="886" font-family="'Noto Sans CJK SC','Source Han Sans SC','WenQuanYi Zen Hei',sans-serif" font-size="12.5" font-weight="400" fill="#8a94a6" text-anchor="end" opacity="1.0">v0.1 · 2026-10 · 设计构想，非流片验证</text></svg>